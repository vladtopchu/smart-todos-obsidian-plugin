name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Test, build and validate release files
        run: npm ci && npm run package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create draft with files from this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            dist/smart-todos/main.js \
            dist/smart-todos/manifest.json \
            dist/smart-todos/styles.css \
            "dist/smart-todo-$RELEASE_TAG.zip" \
            "dist/smart-todo-$RELEASE_TAG.zip.sha256"
